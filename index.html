<!-- 📊 Percentage Calculator -->
<div class="calculator">
  <h2>📊 Percentage Calculator</h2>

  <input type="number" id="amount" placeholder="Amount (₹)">
  <input type="number" id="percentage" placeholder="Percentage (%)">

  <button class="calculate-btn" onclick="calculatePercentage()">Calculate</button>

  <p class="result-text">
    📌 Percentage Amount:
    <b id="percentageResult">₹0</b>
  </p>
</div>


<!-- 🛍️ Discount Calculator -->
<div class="calculator">
  <h2>🛍️ Discount Calculator</h2>

  <input type="number" id="originalPrice" placeholder="Original Price (₹)">
  <input type="number" id="discountPercent" placeholder="Discount (%)">

  <button class="calculate-btn" onclick="calculateDiscount()">Calculate</button>

  <p class="result-text">
    🏷️ Discount Amount:
    <b id="discountResult">₹0</b>
  </p>

  <p class="result-text">
    💰 Total Amount to Pay:
    <b id="payResult">₹0</b>
  </p>
</div>


<style>
/* Calculate Button */
.calculate-btn {
  background-color: #222;
  color: white;
  font-weight: bold;
  font-size: 16px;
  padding: 12px 25px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.calculate-btn:hover {
  background-color: #000;
}

/* Result Text */
.result-text {
  color: #1976d2;
  font-size: 14px;
  font-weight: bold;
}

/* Green Results */
#percentageResult,
#discountResult {
  color: #28a745;
  font-size: 15px;
  font-weight: bold;
}

/* Final Amount */
#payResult {
  color: #1976d2;
  font-size: 15px;
  font-weight: bold;
}
</style>


<script>
function calculatePercentage() {
  const amount = parseFloat(document.getElementById("amount").value);
  const percentage = parseFloat(document.getElementById("percentage").value);

  if (isNaN(amount) || isNaN(percentage)) {
    alert("Please enter both values.");
    return;
  }

  const result = (amount * percentage) / 100;

  document.getElementById("percentageResult").textContent =
    "₹" + result.toFixed(2);
}


function calculateDiscount() {
  const price = parseFloat(document.getElementById("originalPrice").value);
  const discount = parseFloat(document.getElementById("discountPercent").value);

  if (isNaN(price) || isNaN(discount)) {
    alert("Please enter both values.");
    return;
  }

  if (price < 0 || discount < 0 || discount > 100) {
    alert("Please enter a valid price and discount.");
    return;
  }

  const discountAmount = (price * discount) / 100;
  const finalPrice = price - discountAmount;

  document.getElementById("discountResult").textContent =
    "₹" + discountAmount.toFixed(2);

  document.getElementById("payResult").textContent =
    "₹" + finalPrice.toFixed(2);
}
    </script>
