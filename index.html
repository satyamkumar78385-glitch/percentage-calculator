<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Name Style Generator</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#050505,#101b2d,#050505);
    color:white;
}

header{
    text-align:center;
    padding:25px 15px;
}

header h1{
    margin:0;
    font-size:30px;
    color:#00d9ff;
}

header p{
    color:#aaa;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.input-box{
    background:#111c2d;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 20px #000;
}

input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:18px;
}

.generate{
    width:100%;
    margin-top:12px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#009dff;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.generate:hover{
    background:#007acc;
}

.style-box{
    background:#111c2d;
    margin:12px 0;
    padding:18px;
    border-radius:14px;
    border-left:4px solid #00d9ff;
}

.style-number{
    color:#00d9ff;
    font-size:13px;
    margin-bottom:10px;
}

.name{
    font-size:25px;
    word-break:break-word;
    margin-bottom:14px;
}

.copy{
    padding:9px 17px;
    border:0;
    border-radius:8px;
    background:#00c878;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.copy:hover{
    background:#009c5d;
}


/* =========================
   STYLE 1 - 20
========================= */

.s1{
    font-weight:bold;
    letter-spacing:3px;
}

.s2{
    font-weight:bold;
    text-transform:uppercase;
    text-shadow:0 0 10px #00eaff;
}

.s3{
    font-style:italic;
    font-family:cursive;
}

.s4{
    font-family:Georgia,serif;
    letter-spacing:4px;
}

.s5{
    font-weight:bold;
    text-decoration:underline;
}

.s6{
    font-family:"Courier New",monospace;
    letter-spacing:2px;
}

.s7{
    font-weight:bold;
    text-shadow:2px 2px 0 #ff006e;
}

.s8{
    font-style:italic;
    text-shadow:0 0 8px #9d00ff;
}

.s9{
    font-weight:bold;
    letter-spacing:6px;
}

.s10{
    font-family:Georgia,serif;
    font-weight:bold;
    text-shadow:3px 3px 0 #555;
}

.s11{
    background:linear-gradient(90deg,#00eaff,#ff00c8);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    font-weight:bold;
}

.s12{
    background:linear-gradient(90deg,#ffdd00,#ff6600);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    font-weight:bold;
}

.s13{
    color:#00ff88;
    text-shadow:0 0 12px #00ff88;
    font-weight:bold;
}

.s14{
    color:#ff3b81;
    text-shadow:0 0 12px #ff0066;
    font-weight:bold;
}

.s15{
    color:#ffd700;
    text-shadow:2px 2px 5px #000;
    font-weight:bold;
}

.s16{
    font-family:cursive;
    font-style:italic;
    font-weight:bold;
    transform:skewX(-8deg);
}

.s17{
    border:2px solid #00d9ff;
    padding:8px 15px;
    display:inline-block;
    border-radius:8px;
    font-weight:bold;
}

.s18{
    background:#000;
    padding:8px 15px;
    display:inline-block;
    border-radius:8px;
    color:#fff;
    box-shadow:0 0 15px #00d9ff;
}

.s19{
    font-size:28px;
    font-weight:bold;
    letter-spacing:2px;
    text-transform:uppercase;
}

.s20{
    font-family:Georgia,serif;
    font-size:30px;
    font-style:italic;
    font-weight:bold;
    text-shadow:0 0 8px #ffffff;
}


/* =========================
   STYLE 21 - 30
========================= */

.s21{
    font-size:28px;
    font-weight:bold;
    font-style:italic;
    color:#00eaff;
    text-shadow:2px 2px 5px #000;
}

.s22{
    font-size:28px;
    font-weight:bold;
    font-style:italic;
    letter-spacing:3px;
    color:#ff4d4d;
}

.s23{
    font-family:Georgia,serif;
    font-size:29px;
    font-weight:bold;
    font-style:italic;
    text-decoration:underline;
}

.s24{
    font-size:27px;
    font-weight:bold;
    font-style:italic;
    color:#b86cff;
    text-shadow:0 0 12px #8c00ff;
}

.s25{
    font-size:27px;
    font-weight:bold;
    font-style:italic;
    color:#00ff9d;
    letter-spacing:2px;
}

.s26{
    font-size:29px;
    font-weight:bold;
    font-style:italic;
    color:#ffd700;
    text-shadow:3px 3px 5px #222;
}

.s27{
    font-size:28px;
    font-weight:bold;
    font-style:italic;
    border-bottom:3px solid #ff1493;
    display:inline-block;
}

.s28{
    font-size:27px;
    font-weight:bold;
    font-style:italic;
    background:linear-gradient(90deg,#ff0080,#00eaff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.s29{
    font-size:28px;
    font-weight:bold;
    font-style:italic;
    letter-spacing:5px;
    text-shadow:0 0 10px #ffffff;
}

.s30{
    font-size:30px;
    font-weight:bold;
    font-style:italic;
    color:white;
    text-shadow:
        2px 2px 0 #ff0066,
        4px 4px 0 #009dff;
}


/* =========================
   LAST 9 UNICODE STYLES
========================= */

.unicode{
    font-size:25px;
    font-weight:bold;
    line-height:1.6;
}


/* =========================
   EXTRA TITLE
========================= */

.extra-title{
    text-align:center;
    margin:30px 0 15px;
    color:#00d9ff;
}

.extra-title h2{
    margin:0;
    font-size:23px;
}

.extra-title p{
    color:#aaa;
    font-size:14px;
}


footer{
    text-align:center;
    padding:25px;
    color:#777;
}

</style>
</head>

<body>


<header>

    <h1>✨ Name Style Generator</h1>

    <p>
        Apna naam likhiye aur stylish design paaiye
    </p>

</header>


<div class="container">

    <div class="input-box">

        <input
            type="text"
            id="nameInput"
            placeholder="Apna naam likhe..."
            oninput="generateNames()"
        >

        <button
            class="generate"
            onclick="generateNames()">

            ✨ Generate Name

        </button>

    </div>


    <div id="styles"></div>

</div>


<footer>

    Made with ❤️ by Satyam Kumar

</footer>


<script>


/* =========================
   30 DESIGN CLASSES
========================= */

const styleClasses = [

    "s1","s2","s3","s4","s5",
    "s6","s7","s8","s9","s10",
    "s11","s12","s13","s14","s15",
    "s16","s17","s18","s19","s20",
    "s21","s22","s23","s24","s25",
    "s26","s27","s28","s29","s30"

];


/* =========================
   DECORATIONS
========================= */

const decorations = [

    "",
    "★ ",
    "『 ",
    "【 ",
    "꧁ ",
    "✦ ",
    "⚡ ",
    "ツ ",
    "亗 ",
    "彡 ",
    "✧ ",
    "༺ ",
    "♛ ",
    "♡ ",
    "☯ ",
    "✪ ",
    "➤ ",
    "〆 ",
    "乂 ",
    "♕ ",
    "✰ ",
    "⚜ ",
    "☘ ",
    "✵ ",
    "❖ ",
    "♚ ",
    "☠ ",
    "✯ ",
    "★彡 ",
    "༒ "

];


/* =========================
   9 UNICODE NAME STYLES
========================= */

function unicodeStyles(name){

    return [

        "𝓢𝓪𝓽𝔂𝓪𝓶 " + name.replace(/^Satyam /i,""),

        "𝑺𝒂𝒕𝒚𝒂𝒎 " + name.replace(/^Satyam /i,""),

        "𝗦𝗔𝗧𝗬𝗔𝗠 " + name.replace(/^Satyam /i,""),

        "𝙎𝘼𝙏𝙔𝘼𝙈 " + name.replace(/^Satyam /i,""),

        "𝕊𝕒𝕥𝕪𝕒𝕞 " + name.replace(/^Satyam /i,""),

        "𝔖𝔞𝔱𝔶𝔞𝔪 " + name.replace(/^Satyam /i,""),

        "Ｓａｔｙａｍ " + name.replace(/^Satyam /i,""),

        "🅢🅐🅣🅨🅐🅜 " + name.replace(/^Satyam /i,""),

        "Ⓢⓐⓣⓨⓐⓜ " + name.replace(/^Satyam /i,"")

    ];

}


/* =========================
   GENERATE
========================= */

function generateNames(){

    let name =
        document
        .getElementById("nameInput")
        .value
        .trim();


    let container =
        document.getElementById("styles");


    if(name === ""){

        container.innerHTML =
        "<p style='text-align:center;color:#aaa;'>Pehle apna naam likhiye 👆</p>";

        return;

    }


    let html = "";


    /* =========================
       STYLE 1 - 30
    ========================= */

    for(let i=0; i<30; i++){

        let styledName =
            decorations[i] + name;


        html += `

        <div class="style-box">

            <div class="style-number">
                STYLE ${i+1}
            </div>

            <div
                class="name ${styleClasses[i]}"
                id="normal${i}">

                ${escapeHTML(styledName)}

            </div>

            <button
                class="copy"
                onclick="copyName('normal${i}')">

                📋 Copy

            </button>

        </div>

        `;

    }


    /* =========================
       INSTAGRAM / WHATSAPP
       TITLE
    ========================= */

    let unicode =
        unicodeStyles(name);


    html += `

        <div class="extra-title">

            <h2>
                📱 Instagram WhatsApp Stylish Name
            </h2>

            <p>
                Copy karke apne profile ya bio me use karein
            </p>

        </div>

    `;


    /* =========================
       STYLE 31 - 39
    ========================= */

    for(let i=0; i<unicode.length; i++){

        html += `

        <div class="style-box">

            <div class="style-number">

                STYLE ${i + 31}

            </div>


            <div
                class="name unicode"
                id="unicode${i}">

                ${escapeHTML(unicode[i])}

            </div>


            <button
                class="copy"
                onclick="copyName('unicode${i}')">

                📋 Copy

            </button>

        </div>

        `;

    }


    container.innerHTML = html;

}


/* =========================
   COPY
========================= */

function copyName(id){

    let text =
        document
        .getElementById(id)
        .innerText;


    if(navigator.clipboard){

        navigator.clipboard
        .writeText(text)
        .then(function(){

            alert("Name copied! ✅");

        });

    }else{

        let area =
            document.createElement("textarea");

        area.value = text;

        document.body.appendChild(area);

        area.select();

        document.execCommand("copy");

        area.remove();

        alert("Name copied! ✅");

    }

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   DEFAULT NAME
========================= */

document
    .getElementById("nameInput")
    .value = "Satyam Kumar";


generateNames();

</script>

</body>
</html>
