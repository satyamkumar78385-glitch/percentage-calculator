<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Percentage Calculator</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    padding:20px;
    background:linear-gradient(135deg,#ff0080,#7928ca,#00c6ff);
}

.container{
    max-width:450px;
    margin:auto;
}

.header{
    text-align:center;
    color:white;
    margin-bottom:20px;
}

.header h1{
    margin:5px;
    font-size:30px;
}

.header p{
    margin:5px;
    opacity:.9;
}

.card{
    background:rgba(255,255,255,.96);
    padding:22px;
    border-radius:25px;
    box-shadow:0 15px 35px #0004;
}

.card h2{
    margin-top:0;
    color:#4c1d95;
}

input{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:2px solid #ddd;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#7c3aed;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(90deg,#ff0080,#7c3aed);
}

.clear{
    background:linear-gradient(90deg,#ff4b2b,#ff416c);
}

.result{
    margin-top:15px;
    padding:18px;
    border-radius:15px;
    text-align:center;
    background:linear-gradient(135deg,#dbeafe,#f3e8ff);
    color:#4c1d95;
    font-size:25px;
    font-weight:bold;
}

.footer{
    text-align:center;
    color:white;
    margin-top:20px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🌈 Smart Percentage</h1>
        <p>Easy • Fast • Accurate</p>
    </div>

    <div class="card">

        <h2>📚 Marks Percentage</h2>

        <input
            id="obtained"
            type="number"
            placeholder="Obtained Marks"
        >

        <input
            id="total"
            type="number"
            placeholder="Total Marks"
        >

        <button onclick="calculate()">
            Calculate Percentage
        </button>

        <button class="clear" onclick="clearData()">
            Clear
        </button>

        <div class="result" id="result">
            0.00%
        </div>

    </div>

    <div class="footer">
        Made with ❤️ by Satyam Kumar
    </div>

</div>

<script>

function calculate(){

    let obtained =
        Number(document.getElementById("obtained").value);

    let total =
        Number(document.getElementById("total").value);

    if(total <= 0 || obtained < 0 || obtained > total){

        document.getElementById("result").innerText =
        "⚠️ Enter valid marks";

        return;
    }

    let percentage =
        (obtained / total) * 100;

    document.getElementById("result").innerText =
        "🎯 " + percentage.toFixed(2) + "%";
}


function clearData(){

    document.getElementById("obtained").value = "";

    document.getElementById("total").value = "";

    document.getElementById("result").innerText =
    "0.00%";
}

</script>

</body>
</html>
