
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayari World</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:white;font-family:Arial,sans-serif}
header{background:#e50936;text-align:center;padding:20px}
header h1{margin:0}
header p{margin:8px 0 0}
main{max-width:700px;margin:auto;padding:14px}
input{width:100%;padding:13px;border-radius:9px;border:1px solid #555;background:#222;color:white;font-size:16px}
.categories{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
button{border:0;border-radius:8px;padding:10px;background:#333;color:white;cursor:pointer}
button.active,.red{background:#e50936}
.card{background:#202020;border:1px solid #383838;border-radius:12px;padding:15px;margin:12px 0}
.card h3{color:#ff5474;margin-top:0}
.card p{white-space:pre-line;line-height:1.8}
.actions{display:flex;gap:8px;flex-wrap:wrap}
footer{text-align:center;padding:20px;color:#aaa}
</style>
</head>
<body>
<header>
<h1>❤️ Shayari World</h1>
<p>दिल से लिखी, दिल तक पहुँची ✨</p>
</header>
<main>
<input id="search" placeholder="🔍 शायरी खोजें..." oninput="render()">
<div class="categories" id="categories"></div>
<div id="list"></div>
</main>
<footer>Made with ❤️ | Shayari World</footer>
<script>
const data={
"😎 Attitude":[
"अपनी पहचान खुद बनानी है,\nभीड़ में नहीं, अलग नज़र आनी है।",
"हमारी खामोशी को कमजोरी मत समझना,\nहमारा वक्त भी आएगा।",
"अंदाज़ अपना सबसे अलग रखते हैं,\nतभी तो अपनी पहचान रखते हैं।",
"मंज़िल अपनी, रास्ते अपने,\nसपने अपने, इरादे अपने।",
"हम खुद पर भरोसा रखते हैं,\nइसलिए मुश्किलों से नहीं डरते।",
"नाम छोटा हो सकता है,\nलेकिन सपने बड़े हैं।",
"दूसरों की नकल नहीं करते,\nहम अपना अंदाज़ खुद बनाते हैं।",
"वक्त बदलता है, हालात बदलते हैं,\nमेहनत से दिन बदलते हैं।",
"अपनी कीमत खुद पहचानो,\nदुनिया तो कीमत लगाती रहेगी।",
"शोर नहीं, काम से पहचान बनानी है,\nहमें अपनी मंज़िल खुद पानी है।"
],
"❤️ Love":[
"तेरी मुस्कान प्यारी लगती है,\nतेरी हर बात न्यारी लगती है।",
"दिल की हर धड़कन में तेरा नाम है,\nमेरे लिए तू सबसे खास है।",
"तेरी खुशी मेरी दुआ बन जाए,\nतेरी मुस्कान मेरी वजह बन जाए।",
"तुम पास रहो या दूर,\nदिल में रहोगे जरूर।",
"तेरी बातें दिल को छू जाती हैं,\nतेरी यादें मुस्कान लाती हैं।",
"मोहब्बत सच्चे एहसास का नाम है,\nदिल का रिश्ता सबसे खास है।",
"एक प्यारी सी मुस्कान तुम्हारी,\nदिन बना देती है हमारी।",
"तुमसे बात हो जाए तो अच्छा लगता है,\nहर लम्हा खास लगता है।",
"तुम्हारी खुशी में मेरी खुशी है,\nयही प्यार की खूबसूरती है।",
"दिल से जो रिश्ता बनता है,\nवह वक्त के साथ गहरा होता है।"
],
"💔 Sad":[
"कुछ बातें अधूरी रह जाती हैं,\nकुछ यादें दिल में रह जाती हैं।",
"हर मुस्कान खुशी की निशानी नहीं,\nहर खामोशी परेशानी नहीं।",
"वक्त के साथ सब बदल जाता है,\nकभी अपना भी पराया हो जाता है।",
"यादें कभी-कभी बहुत सताती हैं,\nपुरानी बातें फिर याद आती हैं।",
"हर किसी को अपना समझना ठीक नहीं,\nहर मुस्कान के पीछे खुशी नहीं।",
"कुछ रिश्ते नाम के रह जाते हैं,\nकुछ लोग याद बनकर रह जाते हैं।",
"खामोशी भी बहुत कुछ कहती है,\nबस समझने वाली नज़र चाहिए।",
"दिल की बात हर कोई समझ नहीं पाता,\nहर अपना साथ निभा नहीं पाता।",
"बीता हुआ कल लौटकर नहीं आता,\nपर यादों का सिलसिला जाता नहीं।",
"जो मिला उसकी कदर करना सीखो,\nहर पल खुशी से जीना सीखो।"
],
"🎯 Motivation":[
"सपने देखो और मेहनत करो,\nअपने कल को बेहतर करो।",
"हार से कभी घबराना नहीं,\nकोशिश करना छोड़ना नहीं।",
"धीरे चलो मगर चलते रहो,\nअपने लक्ष्य की ओर बढ़ते रहो।",
"मेहनत का फल जरूर मिलता है,\nसच्चे इरादों को रास्ता मिलता है।",
"आज की मेहनत कल की पहचान है,\nहौसला ही असली उड़ान है।",
"मुश्किलें रास्ता रोकेंगी जरूर,\nहिम्मत से मंज़िल मिलेगी जरूर।",
"अपनी गलतियों से सीखते रहो,\nहर दिन बेहतर बनते रहो।",
"सफलता एक दिन में नहीं मिलती,\nलगन से हर मंज़िल मिलती।",
"लक्ष्य पर अपना ध्यान रखो,\nमेहनत पर विश्वास रखो।",
"खुद पर विश्वास बनाए रखना,\nअपने सपनों को सच बनाना।"
],
"🤝 Friendship":[
"दोस्ती का रिश्ता खास होता है,\nहर दोस्त दिल के पास होता है।",
"सच्चा दोस्त वही कहलाता है,\nमुश्किल में साथ निभाता है।",
"दोस्ती में ना कोई हिसाब हो,\nबस दिल से दिल का साथ हो।",
"दोस्तों के साथ हर पल सुहाना,\nउनके बिना अधूरा जमाना।",
"हँसी-मजाक और प्यारी बातें,\nदोस्ती की यादगार सौगातें।",
"अच्छे दोस्त किस्मत से मिलते हैं,\nदिल के करीब हमेशा रहते हैं।",
"दोस्ती भरोसे का नाम है,\nयह रिश्ता सबसे खास है।",
"रास्ते अलग हों तो क्या हुआ,\nदोस्ती का रिश्ता कम नहीं हुआ।",
"दोस्त वो जो हौसला बढ़ाए,\nमुश्किल वक्त में रास्ता दिखाए।",
"दोस्ती में सच्चाई जरूरी है,\nदिल से निभाना जरूरी है।"
]
};

let selected="सभी";
const cats=document.getElementById("categories");

function makeCategories(){
 cats.innerHTML="";
 ["सभी",...Object.keys(data)].forEach(name=>{
  const b=document.createElement("button");
  b.textContent=name;
  b.className=selected===name?"active":"";
  b.onclick=()=>{selected=name;makeCategories();render()};
  cats.appendChild(b);
 });
}

function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=document.getElementById("list");
 list.innerHTML="";
 let count=0;
 Object.entries(data).forEach(([cat,items])=>{
  if(selected!=="सभी"&&selected!==cat)return;
  items.forEach((s,i)=>{
   if(!s.toLowerCase().includes(q)&&!cat.toLowerCase().includes(q))return;
   count++;
   const card=document.createElement("div");
   card.className="card";
   const h=document.createElement("h3");
   h.textContent=cat+" Shayari #"+(i+1);
   const p=document.createElement("p");
   p.textContent=s;
   const actions=document.createElement("div");
   actions.className="actions";
   const copy=document.createElement("button");
   copy.className="red";
   copy.textContent="📋 Copy";
   copy.onclick=async()=>{
    try{await navigator.clipboard.writeText(s)}
    catch(e){
     const t=document.createElement("textarea");
     t.value=s;document.body.appendChild(t);t.select();
     document.execCommand("copy");t.remove();
    }
    copy.textContent="✅ Copied";
   };
   const share=document.createElement("button");
   share.textContent="📤 Share";
   share.onclick=()=>{
    if(navigator.share)navigator.share({text:s}).catch(()=>{});
    else window.open("https://wa.me/?text="+encodeURIComponent(s));
   };
   actions.append(copy,share);
   card.append(h,p,actions);
   list.appendChild(card);
  });
 });
 if(!count)list.textContent="कोई शायरी नहीं मिली।";
}
makeCategories();
render();
</script>
</body>
</html>
