
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satyam Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eaf2ff;
    margin: 0;
    padding: 20px 0;
}

.calculator {
    background: white;
    width: 90%;
    max-width: 400px;
    margin: 20px auto;
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 5px 20px #0002;
}

h2, h3 {
    color: #1769e0;
}

h2, p {
    text-align: center;
}

p { color: #666; }

input {
    width: 100%;
    padding: 14px;
    margin: 9px 0;
    border: 1px solid #ccc;
    border-radius: 9px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: none;
    border-radius: 9px;
    background: #1769e0;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.clear {
    background: #555;
}

.result {
    background: #f0f7ff;
    border: 2px solid #1769e0;
    padding: 18px;
    border-radius: 14px;
    margin-top: 18px;
    line-height: 2;
    color: #222;
    display: none;
    scroll-margin-top: 20px;
    box-shadow: 0 4px 12px #1769e020;
}

.answer {
    display: block;
    background: white;
    border: 1px solid #b8d5ff;
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
    color: #168447;
    font-size: 23px;
    font-weight: bold;
    text-align: center;
}

hr {
    border: 0;
    border-top: 1px solid #ddd;
    margin: 22px 0;
}
</style>
</head>

<body>

<div class="calculator">

<h2>Satyam Calculator</h2>
<p>Smart Tools for Everyday</p>

<hr>

<!-- Percentage Calculator -->

<h3>1. Percentage Calculator</h3>

<input type="number" id="total" placeholder="Total Marks">
<input type="number" id="obtained" placeholder="Obtained Marks">
<input type="number" id="percentage" placeholder="Percentage (%)">

<button onclick="calculatePercentage()">
Calculate Percentage
</button>

<button class="clear" onclick="clearPercentage()">
Clear Percentage
</button>

<div class="result" id="percentageResult"></div>

<hr>

<!-- Discount Calculator -->

<h3>2. Discount Calculator</h3>

<input type="number" id="price" placeholder="Original Price (₹)">
<input type="number" id="discount" placeholder="Discount (%)">

<button onclick="calculateDiscount()">
Calculate Discount
</button>

<button class="clear" onclick="clearDiscount()">
Clear Discount
</button>

<div class="result" id="discountResult"></div>

</div>

<script>

// Automatic Scroll
function showResult(id) {
    let box = document.getElementById(id);
    box.style.display = "block";

    setTimeout(() => {
        box.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });
    }, 100);
}

// Percentage Calculator

function calculatePercentage() {

let t = document.getElementById("total");
let o = document.getElementById("obtained");
let p = document.getElementById("percentage");

let total = t.value;
let obtained = o.value;
let percentage = p.value;

let count = [total, obtained, percentage]
.filter(v => v !== "").length;

if(count !== 2) {
alert("Please enter any TWO values!");
return;
}

let answer = "";

if(total === "" && obtained !== "" && percentage !== "") {

if(Number(percentage) <= 0 ||
Number(percentage) > 100 ||
Number(obtained) < 0) {
alert("Invalid values!");
return;
}

let value = Number(obtained) * 100 / Number(percentage);
t.value = value.toFixed(2);
answer = "Total Marks = " + value.toFixed(2);

}

else if(obtained === "" && total !== "" && percentage !== "") {

if(Number(total) <= 0 ||
Number(percentage) < 0 ||
Number(percentage) > 100) {
alert("Invalid values!");
return;
}

let value = Number(total) * Number(percentage) / 100;
o.value = value.toFixed(2);
answer = "Obtained Marks = " + value.toFixed(2);

}

else if(percentage === "" && total !== "" && obtained !== "") {

if(Number(total) <= 0 ||
Number(obtained) < 0 ||
Number(obtained) > Number(total)) {
alert("Invalid values!");
return;
}

let value = Number(obtained) / Number(total) * 100;
p.value = value.toFixed(2);
answer = "Percentage = " + value.toFixed(2) + "%";

}

document.getElementById("percentageResult").innerHTML = `
<strong>Calculation Result</strong>
<div class="answer">${answer}</div>
`;

showResult("percentageResult");
}

function clearPercentage() {

document.getElementById("total").value = "";
document.getElementById("obtained").value = "";
document.getElementById("percentage").value = "";

let box = document.getElementById("percentageResult");
box.style.display = "none";
box.innerHTML = "";
}


// Discount Calculator

function calculateDiscount() {

let price = document.getElementById("price").value;
let discount = document.getElementById("discount").value;

if(price === "" || discount === "" ||
Number(price) < 0 ||
Number(discount) < 0 ||
Number(discount) > 100) {

alert("Please enter valid values!");
return;
}

price = Number(price);
discount = Number(discount);

let discountAmount = price * discount / 100;
let finalAmount = price - discountAmount;

document.getElementById("discountResult").innerHTML = `
<strong>Discount Result</strong><br>

Original Price: ₹${price.toFixed(2)}<br>
Discount: ${discount}%<br>
Discount Amount: ₹${discountAmount.toFixed(2)}

<hr>

<strong>Pay to Shopkeeper:</strong>

<div class="answer">
₹${finalAmount.toFixed(2)}
</div>
`;

showResult("discountResult");
}

function clearDiscount() {

document.getElementById("price").value = "";
document.getElementById("discount").value = "";

let box = document.getElementById("discountResult");
box.style.display = "none";
box.innerHTML = "";
}

</script>

</body>
</html>
