
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eaf2ff;
    margin: 0;
    padding: 20px 0;
}

.calculator {
    background: white;
    width: 90%;
    max-width: 400px;
    margin: 20px auto;
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 5px 20px #0002;
}

h2 {
    color: #1769e0;
    text-align: center;
}

h3 {
    color: #1769e0;
    margin-top: 10px;
}

p {
    color: #666;
    text-align: center;
}

input {
    width: 100%;
    padding: 14px;
    margin: 9px 0;
    border: 1px solid #ccc;
    border-radius: 9px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: none;
    border-radius: 9px;
    background: #1769e0;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.clear {
    background: #555;
}

.result {
    background: #eaf2ff;
    padding: 13px;
    border-radius: 10px;
    margin-top: 15px;
    line-height: 2;
    color: #222;
}

hr {
    border: 0;
    border-top: 1px solid #ccc;
}
</style>
</head>

<body>

<div class="calculator">

<h2>Smart Calculator</h2>
<p>Smart Tools for Everyday</p>

<hr>

<!-- Percentage Calculator -->

<h3>1. Percentage Calculator</h3>

<input type="number" id="total"
placeholder="Total Marks">

<input type="number" id="obtained"
placeholder="Obtained Marks">

<input type="number" id="percentage"
placeholder="Percentage (%)">

<button onclick="calculatePercentage()">
Calculate Percentage
</button>

<button class="clear" onclick="clearPercentage()">
Clear Percentage
</button>

<hr>

<!-- Discount Calculator -->

<h3>2. Discount Calculator</h3>

<input type="number" id="price"
placeholder="Original Price (₹)">

<input type="number" id="discount"
placeholder="Discount (%)">

<button onclick="calculateDiscount()">
Calculate Discount
</button>

<button class="clear" onclick="clearDiscount()">
Clear Discount
</button>

<div class="result" id="discountResult">
Discount Result Will Appear Here
</div>

</div>

<script>

// Percentage Calculator

function calculatePercentage() {

let t = document.getElementById("total");
let o = document.getElementById("obtained");
let p = document.getElementById("percentage");

let total = t.value;
let obtained = o.value;
let percentage = p.value;

let count = [total, obtained, percentage]
.filter(v => v !== "").length;

if(count !== 2) {
alert("Please enter any TWO values!");
return;
}

if(total === "" && obtained !== "" && percentage !== "") {

if(Number(percentage) <= 0 ||
Number(percentage) > 100 ||
Number(obtained) < 0) {
alert("Invalid values!");
return;
}

t.value = (Number(obtained) * 100 /
Number(percentage)).toFixed(2);

}

else if(obtained === "" && total !== "" && percentage !== "") {

if(Number(total) <= 0 ||
Number(percentage) < 0 ||
Number(percentage) > 100) {
alert("Invalid values!");
return;
}

o.value = (Number(total) *
Number(percentage) / 100).toFixed(2);

}

else if(percentage === "" && total !== "" && obtained !== "") {

if(Number(total) <= 0 ||
Number(obtained) < 0 ||
Number(obtained) > Number(total)) {
alert("Invalid values!");
return;
}

p.value = (Number(obtained) /
Number(total) * 100).toFixed(2);

}
}

function clearPercentage() {
document.getElementById("total").value = "";
document.getElementById("obtained").value = "";
document.getElementById("percentage").value = "";
}


// Discount Calculator

function calculateDiscount() {

let price = document.getElementById("price").value;
let discount = document.getElementById("discount").value;

if(price === "" || discount === "" ||
Number(price) < 0 ||
Number(discount) < 0 ||
Number(discount) > 100) {

alert("Please enter valid values!");
return;
}

price = Number(price);
discount = Number(discount);

let discountAmount = price * discount / 100;
let finalAmount = price - discountAmount;

document.getElementById("discountResult").innerHTML = `
<strong>Original Price:</strong> ₹${price.toFixed(2)}<br>

<strong>Discount:</strong> ${discount}%<br>

<strong>Discount Amount:</strong>
₹${discountAmount.toFixed(2)}

<hr>

<strong>Pay to Shopkeeper:</strong>
<span style="color:green;font-size:22px">
₹${finalAmount.toFixed(2)}
</span>
`;
}

function clearDiscount() {
document.getElementById("price").value = "";
document.getElementById("discount").value = "";

document.getElementById("discountResult").innerHTML =
"Discount Result Will Appear Here";
}

</script>

</body>
</html>
