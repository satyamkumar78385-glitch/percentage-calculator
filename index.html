<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Durga Puja Shayari Generator</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#fff3e0,#ffe0b2,#fff8e1);
    color:#4a1a00;
    min-height:100vh;
}

header{
    text-align:center;
    padding:25px 15px;
    background:linear-gradient(135deg,#d84315,#ff9800);
    color:white;
    border-radius:0 0 25px 25px;
    box-shadow:0 4px 12px #999;
}

header h1{
    font-size:28px;
}

header p{
    margin-top:8px;
    font-size:15px;
}

.container{
    max-width:650px;
    margin:25px auto;
    padding:15px;
}

.box{
    background:white;
    padding:20px;
    margin-bottom:18px;
    border-radius:18px;
    box-shadow:0 4px 15px #d6c2b0;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

input,select{
    width:100%;
    padding:13px;
    border:2px solid #ff9800;
    border-radius:10px;
    font-size:16px;
    outline:none;
    margin-bottom:15px;
}

button{
    border:none;
    padding:13px 18px;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin:5px 3px;
}

.generate{
    width:100%;
    background:#d84315;
    color:white;
    font-size:17px;
}

.generate:hover{
    background:#bf360c;
}

.result{
    display:none;
    background:#fff8e1;
    border:2px dashed #ff9800;
    border-radius:15px;
    padding:18px;
    margin-top:15px;
    text-align:center;
    line-height:1.7;
    font-size:18px;
}

.copy{
    background:#388e3c;
    color:white;
}

.whatsapp{
    background:#25D366;
    color:white;
}

.share{
    background:#1565c0;
    color:white;
}

.new{
    background:#ff9800;
    color:white;
}

footer{
    text-align:center;
    padding:20px;
    color:#7b4a2e;
    font-size:14px;
}
</style>
</head>

<body>

<header>
    <h1>🌺 माँ दुर्गा 🌺</h1>
    <p>Durga Puja Shayari & Wishes Generator</p>
</header>

<div class="container">

    <div class="box">
        <label>👤 अपना नाम लिखें</label>
        <input type="text" id="name" placeholder="जैसे - Satyam Kumar">

        <label>📌 क्या बनाना है?</label>
        <select id="type">
            <option value="shayari">🌺 Durga Puja Shayari</option>
            <option value="wish">🙏 Durga Puja Wish</option>
            <option value="status">📱 WhatsApp Status</option>
            <option value="caption">📸 Instagram Caption</option>
            <option value="title">🎬 YouTube Title</option>
        </select>

        <button class="generate" onclick="generateText()">
            ✨ अभी Generate करें
        </button>

        <div class="result" id="result"></div>

        <div style="text-align:center;">
            <button class="copy" onclick="copyText()">📋 Copy</button>
            <button class="whatsapp" onclick="whatsapp()">🟢 WhatsApp</button>
            <button class="share" onclick="shareText()">📤 Share</button>
            <button class="new" onclick="generateText()">🔄 New</button>
        </div>
    </div>

    <div class="box">
        <h2>🪔 Durga Puja Special</h2>
        <p style="margin-top:10px;line-height:1.6;">
            माँ दुर्गा का आशीर्वाद आपके जीवन में सुख, शांति,
            सफलता और खुशियाँ लेकर आए। 🌺🙏
        </p>
    </div>

</div>

<footer>
    © 2026 Durga Puja Generator | Made with ❤️
</footer>


<script>

const data = {

shayari: [
"🌺 माँ दुर्गा की भक्ति में रंग जाए संसार,\nहर चेहरे पर हो खुशियों की बहार।\nजय माता दी 🙏",
"🪔 शेरों वाली माता का आशीर्वाद रहे,\nहर कदम पर खुशियों का साथ रहे।\nजय माँ दुर्गा 🌺",
"🌺 नवरात्रि की पावन बेला आई है,\nमाँ दुर्गा अपने साथ खुशियाँ लाई हैं।\nजय माता दी 🙏"
],

wish: [
"🌺 आपको और आपके पूरे परिवार को दुर्गा पूजा की हार्दिक शुभकामनाएँ।\nमाँ दुर्गा आपके जीवन को खुशियों से भर दें। 🙏",
"🪔 माँ दुर्गा का आशीर्वाद हमेशा आपके साथ रहे।\nआपके जीवन में सुख, शांति और सफलता बनी रहे।\nशुभ दुर्गा पूजा 🌺",
"🙏 जय माँ दुर्गा!\nयह पावन पर्व आपके जीवन में नई खुशियाँ और नई उम्मीदें लेकर आए। 🌺"
],

status: [
"🌺 माँ दुर्गा का आशीर्वाद, जीवन का सबसे बड़ा सहारा। 🙏\nजय माता दी!",
"🪔 दिल में भक्ति, चेहरे पर मुस्कान,\nमाँ दुर्गा का नाम ही मेरी पहचान। 🌺",
"🙏 जहाँ माँ दुर्गा का आशीर्वाद होता है,\nवहाँ डर कैसा! 🌺 जय माता दी!"
],

caption: [
"🌺 माँ दुर्गा की भक्ति में रंगा आज का दिन 🙏 #DurgaPuja #JaiMataDi",
"🪔 भक्ति भी, शक्ति भी और माँ का आशीर्वाद भी 🌺🙏",
"🌺 माँ के दरबार में जो आता है,\nखाली हाथ नहीं जाता। 🙏 #DurgaPuja"
],

title: [
"🌺 Durga Puja Special | जय माँ दुर्गा 🙏 | माता रानी का आशीर्वाद",
"🪔 Durga Puja 2026 Special | माँ दुर्गा की भक्ति 🌺",
"🙏 जय माता दी | Durga Puja Special Video | माँ दुर्गा का आशीर्वाद"
]

};

function generateText(){

    let name = document.getElementById("name").value.trim();
    let type = document.getElementById("type").value;

    let list = data[type];
    let text = list[Math.floor(Math.random() * list.length)];

    if(name !== ""){
        text = "🌺 " + name + " के लिए 🌺\n\n" + text;
    }

    let result = document.getElementById("result");

    result.innerText = text;
    result.style.display = "block";
}

function copyText(){

    let text = document.getElementById("result").innerText;

    if(!text){
        alert("पहले Generate करें!");
        return;
    }

    navigator.clipboard.writeText(text);

    alert("✅ Text Copy हो गया!");
}

function whatsapp(){

    let text = document.getElementById("result").innerText;

    if(!text){
        alert("पहले Generate करें!");
        return;
    }

    let url = "https://wa.me/?text=" + encodeURIComponent(text);

    window.open(url,"_blank");
}

function shareText(){

    let text = document.getElementById("result").innerText;

    if(!text){
        alert("पहले Generate करें!");
        return;
    }

    if(navigator.share){

        navigator.share({
            title:"Durga Puja Wishes",
            text:text
        });

    }else{

        navigator.clipboard.writeText(text);
        alert("✅ Text Copy हो गया, अब कहीं भी Share कर सकते हैं!");

    }
}

</script>

</body>
</html>
